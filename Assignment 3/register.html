<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.avif" type="image/x-icon">
    <title>Register</title>
</head>
<body>
    
    <p><h3>Fill the details and click on register to register for the event</h3></p>

    <form>
        <label for="name">Name :</label>
        <input type="text" id="name" name="name" placeholder="Enter Your Full Name">
        <br>
        <br>

        <label for="mail">Email :</label>
        <input type="email" id="email" name="email" placeholder="Enter Your Email">
        <br>
        <br>

        <label for="password">Password :</label>
        <input type="password" id="password" name="password" placeholder="Create your password">
        <br>
        <br>

        <label for="phone">Phone :</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone no.">
        <br>
        <br>

        <label for="dob">Date of Birth :</label>
        <input type="date">

        <fieldset>
            <legend>gender :</legend>

            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>
            <br>

            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
            <br>

            <input type="radio" id="other" name="gender">
            <label for="other">Other</label>
        </fieldset>

        <fieldset>
            <legend>Topic of interest</legend>

            <input type="checkbox" id="html" name="interest">
            <label for="html">HTML</label>
            
            <input type="checkbox" id="java" name="interest">
            <label for="html">Java</label>

            <input type="checkbox" id="python" name="interest">
            <label for="html">Python</label>

            <input type="checkbox" id="c" name="interest">
            <label for="html">C++</label>

            <input type="checkbox" id="other1" name="interest">
            <label for="html">Other</label>
            <br>
            <br>

            <label for="describe">If other describe here</label>
            <br>
            <textarea name="describe0" id="describe" rows="8" cols="20" placeholder="Type Here...."></textarea>
        </fieldset>

        <br>
        <label for="course">Course :</label>
        <select name="course" id="course">
            <option value="Btech">Btech core</option>
            <option value="ai">Btech Ai</option>
            <option value="bca">Bca</option>
        </select>

        <br>
        <br>
        <label for="event">Event you are registering for :</label>
        <select name="event" id="event">
            <option value="Btech">HTML Workshop</option>
            <option value="ai">Hackathon</option>
            <option value="bca">Python Bootcamp</option>
        </select>

        <br>
        <br>
        <label for="file">Upload your photo</label>
        <input type="file" id="file" name="file">
        <br>
        <br>

        <label for="textarea">Why do you want to join ?</label>
        <br>
        <textarea name="textarea" id="textarea" rows="10" cols="40" placeholder="Type Here...."></textarea>
        <br>
        <br>

        <input type="submit" value="submit">

    </form>

    <hr>
    <br>
    <br>
    <nav>
        <a href="home.html">Home</a>
        <a href="register.html">Register</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</body>
</html>
